name: Comprobar enlaces
on:
  schedule:
    - cron: "47 5 * * *"   # cada dia, despues de actualizar la lista
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add estado.md
          git diff --cached --quiet || (git commit -m "Actualizar estado de enlaces" && git push)
