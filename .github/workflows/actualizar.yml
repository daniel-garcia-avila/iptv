name: Actualizar lista
on:
  schedule:
    - cron: "17 5 * * *"   # cada dia (~6-7h en Espana)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py mis_canales_es.m3u8
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add mis_canales_es.m3u8
          git diff --cached --quiet || (git commit -m "Actualizar lista de canales" && git push)
